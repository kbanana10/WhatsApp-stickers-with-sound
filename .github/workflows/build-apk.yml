name: Build Universal Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Universal APK (Android 7.0 - 16+)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Update cmdline-tools and install required SDK packages
        run: |
          sdkmanager --install "cmdline-tools;latest"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Universal Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Signed Release APK (when release secrets are set)
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks" ./gradlew :app:assembleRelease --no-daemon
          rm -f "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Collect APK files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/AudioStickers-universal.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/AudioStickers-universal-release.apk
          fi
          ls -lh release-apks/

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AudioStickers-Universal-APK
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish direct APK download to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Audio Stickers {0}', github.ref_name) || 'Audio Stickers (Latest Universal APK)' }}
          body: |
            Universal APK supporting Android 7.0 (API 24) through Android 16 (API 36+) across all CPU architectures (`arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`).
          files: release-apks/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
